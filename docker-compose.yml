version: "3.9"

services:
  # ---- FastAPI Application ----
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vrip-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/vrip_db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-super-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - DEBUG=true
      - REDIS_URL=redis://redis:6379/0
      - DEFAULT_ADMIN_EMAIL=admin@vrip.com
      - DEFAULT_ADMIN_PASSWORD=Admin@12345
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - vrip-network

  # ---- PostgreSQL Database ----
  db:
    image: postgres:16-alpine
    container_name: vrip-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vrip_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vrip-network

  # ---- Redis (Token Blacklisting) ----
  redis:
    image: redis:7-alpine
    container_name: vrip-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vrip-network

volumes:
  postgres_data:
    driver: local

networks:
  vrip-network:
    driver: bridge
