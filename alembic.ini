# Alembic Configuration File

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Prepend sys.path with the project root
prepend_sys_path = .

# Timezone for file template date rendering
# timezone =

# Max length of revision identifiers
# truncate_slug_length = 40

# Set to 'true' to run the environment during
# the 'revision' command
# revision_environment = false

# Set to 'true' to allow .hierarchical (multiple branch) migrations
# sourceless = false

# Version path separator
# version_path_separator = os

# Output encoding of generated files
output_encoding = utf-8

# Database URL - Overridden by env.py to load from app settings
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/vrip_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
