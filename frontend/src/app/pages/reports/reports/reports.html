<div class="reports-container">

  <!-- Header -->

  <div class="page-header">

    <div>

      <h1>Reports</h1>

      <p>

        Generate and download system reports.

      </p>

    </div>

  </div>

  <!-- Report Cards -->

  <div class="reports-grid">

    <mat-card
      class="report-card"
      *ngFor="let report of reports">

      <mat-icon>

        description

      </mat-icon>

      <h2>

        {{ report.name }}

      </h2>

      <p>

        {{ report.description }}

      </p>

      <div class="buttons">

        <button
          mat-flat-button
          color="primary"
          (click)="generateReport(report.name)">

          Generate

        </button>

        <button
          mat-stroked-button
          (click)="downloadPdf(report.name)">

          PDF

        </button>

        <button
          mat-stroked-button
          (click)="downloadExcel(report.name)">

          Excel

        </button>

      </div>

    </mat-card>

  </div>

  <!-- Placeholder -->

  <mat-card class="placeholder-card">

    <mat-icon>

      analytics

    </mat-icon>

    <h2>

      Report Preview

    </h2>

    <p>

      Generated reports will be displayed here.

    </p>

  </mat-card>

</div>
